<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crimson Ledger — Co-op Vampire Noir Detective RPG</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c0c11;
      font-family: Georgia, "Times New Roman", serif;
      color: #e4ded2;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #18141c 0%, #09090d 100%);
      z-index: 10;
      gap: 14px;
      transition: opacity 0.4s ease;
    }
    #loading-overlay h1 {
      font-size: 1.5rem;
      letter-spacing: 0.14em;
      color: #e8c987;
    }
    #loading-overlay p {
      font-size: 0.95rem;
      color: #9f98a8;
    }
    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #dc2846;
      box-shadow: 0 0 16px #dc2846;
      animation: beat 0.9s infinite ease-in-out;
    }
    @keyframes beat {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      40% { transform: scale(1.35); opacity: 1.0; }
    }
    #game-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#bevy-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="pulse-dot"></div>
    <h1>CRIMSON LEDGER</h1>
    <p id="loading-status">Loading WebAssembly &amp; Noir Assets...</p>
  </div>
  <div id="game-wrap">
    <canvas id="bevy-canvas" oncontextmenu="return false;"></canvas>
  </div>

  <script type="module">
    import init from './pkg/vampire_noir_rpg.js?v=9';

    const overlay = document.getElementById('loading-overlay');
    const statusEl = document.getElementById('loading-status');

    init('./pkg/vampire_noir_rpg_bg.wasm?v=9')
      .catch((err) => {
        // Bevy winit control-flow exception on startup is normal in wasm-bindgen
        if (!String(err).includes("Using exceptions for control flow")) {
          console.error(err);
          statusEl.textContent = "Error launching WASM: " + err;
          return;
        }
      })
      .finally(() => {
        setTimeout(() => {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 400);
        }, 350);
      });
  </script>
</body>
</html>
